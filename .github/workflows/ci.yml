name: Verify source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@10.32.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Check module boundaries
        run: pnpm check:boundaries
      - name: Run synthetic tests
        run: pnpm exec vitest run --maxWorkers=2
      - name: Build frontend
        run: pnpm build
      - name: Test release audit
        run: node --test tools/check-release.test.mjs
      - name: Audit tracked release files
        run: node tools/check-release.mjs
